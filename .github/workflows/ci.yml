name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository checks
        run: ./tests/static.sh
        env:
          REQUIRE_SHELLCHECK: "1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Parse Docker Bake definition
        run: docker buildx bake --print

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/main/Dockerfile

      - name: Lint Alpine Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/alpine/Dockerfile

  smoke:
    name: Docker smoke (${{ matrix.variant }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          - main
          - alpine
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: docker/${{ matrix.variant }}
          load: true
          pull: true
          push: false
          tags: gunicorn-uvicorn-nginx:ci-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Run Docker smoke tests
        run: >-
          ./tests/docker-smoke.sh
          ${{ matrix.variant }}
          gunicorn-uvicorn-nginx:ci-${{ matrix.variant }}

      - name: Build and run examples
        run: >-
          ./tests/examples-smoke.sh
          ${{ matrix.variant }}
          gunicorn-uvicorn-nginx:ci-${{ matrix.variant }}
