client_max_body_size 250m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  application/json
  application/javascript
  application/xml
  application/xml+rss
  image/svg+xml;

location / {
  proxy_pass http://${NGINX_UPSTREAM_ADDRESS}:${NGINX_UPSTREAM_PORT};
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Do not trust a client-supplied X-Forwarded-Proto value by default.
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_connect_timeout 5s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
  proxy_buffering on;
  proxy_request_buffering on;
  proxy_redirect off;
}

location ~* \.sqlite3$ {
  deny all;
}

# Restrict hidden paths without intercepting application-owned /.well-known routes.
# A derived image can add a more specific server.d location for static ACME files.
location ~ /\.(?!well-known(?:/|$)) {
  deny all;
}
